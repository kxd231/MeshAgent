name: Windows Build

run-name: Build Windows versions of MeshAgent

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # The x64 build links TurboJPEG (KVM tile encoding). Official libjpeg-turbo release asset and its published SHA-256 digest,
  # the same as in kvm-perf-release.yml.
  TURBOJPEG_URL: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0-vc-x64.exe
  TURBOJPEG_SHA256: 662761d8ba8dae04aec74023ebaeceb856c2b56b9b59cfd180759d26300dda42

jobs:
  windows-build:
    runs-on: ${{ matrix.platform == 'ARM64' && 'windows-11-arm' || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
    - name: Install libjpeg-turbo (verified, x64 only)
      if: matrix.platform == 'x64'
      shell: pwsh
      run: |
        $exe = "$env:RUNNER_TEMP\libjpeg-turbo.exe"
        Invoke-WebRequest -Uri $env:TURBOJPEG_URL -OutFile $exe
        $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
        if ($hash -ne $env:TURBOJPEG_SHA256) { throw "libjpeg-turbo checksum mismatch: $hash" }
        Start-Process -FilePath $exe -ArgumentList '/S','/D=C:\libjpeg-turbo64' -Wait
        if (-not (Test-Path 'C:\libjpeg-turbo64\lib\turbojpeg-static.lib')) { throw 'turbojpeg-static.lib not installed' }
    - name: Build ${{ matrix.platform }}
      run: msbuild MeshAgent-2022.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }}
    - name: Upload ${{ matrix.platform }} artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        if-no-files-found: error
        name: meshagent-windows-${{ matrix.platform }}
        path: ${{ github.ref_type == 'tag' && 'Release/MeshService*.exe' || 'Release/*.exe' }}
