name: macOS Build
run-name: Build MacOS versions of MeshAgent
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  macos-build-arm64:
    name: macOS arm64 (ARCHID=29)
    runs-on: macos-15
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build meshagent (arm64, KVM enabled)
        run: make -j4 macos ARCHID=29
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-macos-arm64
          path: ${{ github.workspace }}/meshagent_osx-arm-64

  macos-build-x86_64:
    name: macOS x86_64 (ARCHID=16)
    runs-on: macos-15-intel
    steps:
      - name: Check out repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build meshagent (x86_64, KVM enabled)
        run: make -j4 macos ARCHID=16
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: meshagent-macos-x86_64
          path: ${{ github.workspace }}/meshagent_osx-x86-64

  macos-build-universal:
    name: macOS universal installer
    needs: [macos-build-arm64, macos-build-x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: meshagent-macos-*
          path: binaries
          merge-multiple: true
      - name: Combine architectures
        run: |
          lipo -create binaries/meshagent_osx-arm-64 binaries/meshagent_osx-x86-64 -output meshagent_osx-universal-64
          lipo meshagent_osx-universal-64 -verify_arch arm64 x86_64
          codesign --force --sign - meshagent_osx-universal-64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshagent-macos-universal
          path: meshagent_osx-universal-64
          if-no-files-found: error
