name: KVM perf build (Windows x64)

# Builds MeshService64.exe with TurboJPEG from a tag and puts it into a DRAFT release of that tag. The owner checks the
# hashes in the run summary, writes the notes and publishes the draft; published releases are immutable, so the files
# cannot be replaced afterwards (docs/releases.md). Version tags (1.2.0, v1.2.0) belong to release.yml and do not start
# this workflow. Started by hand without a tag, it is a test build: the files stay a workflow artifact, optionally built
# with extra compiler options, and nothing is attached to a release.
on:
  push:
    tags:
      - '**'
      - '![0-9]*'
      - '!v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag without a published release: build it into a draft release. Empty: test build of the selected branch (artifact only).'
        required: false
        default: ''
      extra_cl:
        description: 'Test builds only: extra compiler options for the x64 agent build (CL environment variable), e.g. /DKVM_DXGI_DISABLE for a GDI-only A/B binary'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kvm-perf-build-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  # Official libjpeg-turbo release asset and its published SHA-256 digest
  TURBOJPEG_URL: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0-vc-x64.exe
  TURBOJPEG_SHA256: 662761d8ba8dae04aec74023ebaeceb856c2b56b9b59cfd180759d26300dda42

jobs:
  build:
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Release tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EXTRA_CL: ${{ inputs.extra_cl }}
        run: |
          if [ -n "$TAG" ]; then
            if ! printf '%s\n' "$TAG" | grep -Eqx '[A-Za-z][A-Za-z0-9._-]{0,63}'; then echo "Not a release tag: $TAG" >&2; exit 1; fi
            if [ -n "$EXTRA_CL" ]; then echo "extra_cl is for test builds only, not for a release" >&2; exit 1; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag && format('refs/tags/{0}', steps.tag.outputs.tag) || github.ref }}
          persist-credentials: false

      - name: Install libjpeg-turbo (verified)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\libjpeg-turbo.exe"
          Invoke-WebRequest -Uri $env:TURBOJPEG_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TURBOJPEG_SHA256) { throw "libjpeg-turbo checksum mismatch: $hash" }
          Start-Process -FilePath $exe -ArgumentList '/S','/D=C:\libjpeg-turbo64' -Wait
          if (-not (Test-Path 'C:\libjpeg-turbo64\lib\turbojpeg-static.lib')) { throw 'turbojpeg-static.lib not installed' }

      - name: Build Release x64
        shell: pwsh
        env:
          CL: ${{ inputs.extra_cl }}
        run: |
          # /m:1 builds the projects one after the other: MeshService and MeshConsole both regenerate
          # microscript\ILibDuktape_Commit.h in their pre-build event and fail when they do it at the same time.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          & $vs MeshAgent-2022.sln /m:1 /p:Configuration=Release /p:Platform=x64 /p:TurboJpegDir=C:\libjpeg-turbo64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }

      - name: Build kvm-dxgi-check.exe
        shell: pwsh
        run: |
          # Stand-alone check tool for the DXGI capture (dxgi_capture.cpp without the agent). Not affected by extra_cl.
          $env:CL = ''
          New-Item -ItemType Directory -Force out | Out-Null
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath | Select-Object -First 1
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $cl = 'cl /nologo /O2 /MT /EHsc /W3 /utf-8 /D_LINKVM /DKVM_DXGI /DKVM_DXGI_TOOL meshcore\KVM\Windows\dxgi_capture.cpp meshcore\KVM\Windows\tools\kvm_dxgi_check.cpp /Fo:out\ /Fe:out\kvm-dxgi-check.exe /link user32.lib gdi32.lib'
          cmd /c "call `"$vcvars`" >nul && $cl"
          if ($LASTEXITCODE -ne 0) { throw "kvm-dxgi-check build failed: $LASTEXITCODE" }
          Remove-Item out\*.obj -ErrorAction SilentlyContinue

      - name: Size and hashes
        id: info
        shell: pwsh
        env:
          EXTRA_CL: ${{ inputs.extra_cl }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $commit = git rev-parse HEAD
          $f = Get-ChildItem -Recurse -Filter MeshService64.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $f.FullName out\MeshService64.exe
          $size = (Get-Item out\MeshService64.exe).Length
          $sha384 = (Get-FileHash out\MeshService64.exe -Algorithm SHA384).Hash.ToLower()
          $sha256 = (Get-FileHash out\MeshService64.exe -Algorithm SHA256).Hash.ToLower()
          "MeshService64.exe size=$size`nsha384=$sha384`nsha256=$sha256`ncommit=$commit" | Tee-Object out\MeshService64.exe.txt
          "## MeshService64.exe`n`n- tag: $env:TAG`n- commit: $commit`n- size: $size`n- sha384: $sha384`n- sha256: $sha256" >> $env:GITHUB_STEP_SUMMARY
          $tool = Get-FileHash out\kvm-dxgi-check.exe -Algorithm SHA256
          "- kvm-dxgi-check.exe sha256: $($tool.Hash.ToLower())" >> $env:GITHUB_STEP_SUMMARY
          "- extra_cl: $env:EXTRA_CL" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MeshService64
          path: out/

  # The only job with write access: it never runs the build, it only puts the built files into a draft release.
  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload the files
    steps:
      - name: Download the build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: MeshService64
          path: out

      - name: Draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          files=(out/MeshService64.exe out/MeshService64.exe.txt out/kvm-dxgi-check.exe)
          state=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "Release $TAG is already published; its files cannot be replaced." >&2; exit 1
          elif [ "$state" = true ]; then
            gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "$TAG" \
              --notes "Draft made by the KVM perf build. Check the hashes in the run summary, write the notes and publish." -R "$GITHUB_REPOSITORY"
          fi
          echo "Draft release $TAG: MeshService64.exe sha384 $(sha384sum out/MeshService64.exe | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

  # Build check only: the DXGI capture is x64 only, the other platforms must still compile and behave as before.
  # Nothing is uploaded. Builds the same commit as the main job.
  other-platforms:
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            runner: windows-2022
          - platform: ARM64
            runner: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag && format('refs/tags/{0}', needs.build.outputs.tag) || github.ref }}
          persist-credentials: false

      - name: Build Release ${{ matrix.platform }}
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $vs) { $vs = 'msbuild' }
          & $vs MeshAgent-2022.sln /m:1 /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
